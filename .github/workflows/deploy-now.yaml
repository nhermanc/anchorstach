# DISABLED — conflicts with official IONOS Deploy Now.
#
# On every push, "Deploy Now: Orchestration" (anchorstach-orchestration.yaml)
# already builds via anchorstach-build.yaml and deploys via deploy-to-ionos.yaml.
#
# This old v1 workflow used wrong inputs (project-id instead of project,
# missing service-host / branch-id) and published the wrong folder (out vs deploy).
# Left disabled so it cannot fail CI. Delete this file if you no longer need it.
#
# To re-enable a one-shot manual deploy with deploy-to-ionos-action@v1, you would need:
#   project: ${{ secrets.IONOS_PROJECT_ID }}
#   branch-id: ${{ secrets.IONOS_BRANCH_ID }}
#   service-host: api-us.ionos.space
#   dist-folder: deploy
#   and: npm run build:deploy  (not npm run build)

name: Deploy to IONOS (legacy, disabled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE only if you intentionally want this legacy path (prefer Deploy Now orchestration)"
        required: true
        type: string

jobs:
  deploy:
    if: ${{ inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          CI: true
        run: npm run build:deploy

      - name: Deploy to IONOS
        uses: ionos-deploy-now/deploy-to-ionos-action@v1
        with:
          project: ${{ secrets.IONOS_PROJECT_ID }}
          branch-id: ${{ secrets.IONOS_BRANCH_ID }}
          api-key: ${{ secrets.IONOS_API_KEY }}
          service-host: api-us.ionos.space
          dist-folder: deploy
